name: Live site freshness

on:
  schedule:
    # Tuesdays 09:00 UTC, the day after the price refresh has deployed.
    - cron: '0 9 * * 2'
  workflow_dispatch:

jobs:
  freshness:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check the data date shown on the homepage
        run: |
          html=$(curl -fsSL --max-time 30 https://aigpuvalue.com/)
          stamp=$(printf '%s' "$html" | grep -o 'data-prices-updated="[^"]*"' | head -1 | sed 's/.*="//;s/"$//')
          if [ -z "$stamp" ]; then
            echo "::error::Homepage shows no current price data."
            exit 1
          fi
          age_days=$(( ( $(date -u +%s) - $(date -u -d "$stamp" +%s) ) / 86400 ))
          echo "Live price data is from $stamp ($age_days days old)."
          if [ "$age_days" -gt 8 ]; then
            echo "::error::Live price data is $age_days days old. The weekly refresh or the deploy did not run."
            exit 1
          fi
